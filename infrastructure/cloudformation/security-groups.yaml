AWSTemplateFormatVersion: '2010-09-09'
Description: 'Security Groups for DSQL Benchmarking Cluster - SSH and DSQL connectivity'

Parameters:
  EnvironmentName:
    Description: Environment name prefix for resources
    Type: String
    Default: dsql-benchmark

  SSHSourceCIDR:
    Description: CIDR block allowed for SSH access (restrict to your IP for security)
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be a valid CIDR block (e.g., 203.0.113.0/24)

Resources:
  # Security Group for EC2 Benchmark Instances
  BenchmarkSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${EnvironmentName}-benchmark-sg
      GroupDescription: Security group for DSQL benchmark EC2 instances
      VpcId: !ImportValue
        Fn::Sub: ${EnvironmentName}-VpcId
      SecurityGroupIngress:
        # SSH Access
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHSourceCIDR
          Description: SSH access from specified CIDR
      SecurityGroupEgress:
        # Allow all outbound traffic (required for DSQL connectivity and package updates)
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-benchmark-sg

  # Allow benchmark instances to communicate with each other
  BenchmarkInstanceIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref BenchmarkSecurityGroup
      IpProtocol: '-1'
      SourceSecurityGroupId: !Ref BenchmarkSecurityGroup
      Description: Allow all traffic between benchmark instances

Outputs:
  BenchmarkSecurityGroupId:
    Description: Security group ID for benchmark instances
    Value: !Ref BenchmarkSecurityGroup
    Export:
      Name: !Sub ${EnvironmentName}-BenchmarkSecurityGroupId

  BenchmarkSecurityGroupName:
    Description: Security group name for benchmark instances
    Value: !Sub ${EnvironmentName}-benchmark-sg
