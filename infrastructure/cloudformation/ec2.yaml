          echo 'export JAVA_HOME=/usr/lib/jvm/java-21-amazon-corretto' >> /etc/profile.d/java.sh
          echo 'export PATH=$JAVA_HOME/bin:$PATH' >> /etc/profile.d/java.sh
          source /etc/profile.d/java.sh
          
          java -version
          
          mkdir -p /opt/benchmark
          chown ec2-user:ec2-user /opt/benchmark
          
          cd /opt/benchmark
          git clone --depth 1 https://github.com/amazon-contributing/aurora-dsql-benchbase-benchmarking.git
          chown -R ec2-user:ec2-user aurora-dsql-benchbase-benchmarking
          
          cd aurora-dsql-benchbase-benchmarking
          sudo -u ec2-user ./mvnw clean package -P auroradsql -DskipTests
          
          cd target
          sudo -u ec2-user tar xvzf benchbase-auroradsql.tgz
          
          cat > /opt/benchmark/benchmark-env.sh << 'ENVEOF'
          export JAVA_HOME=/usr/lib/jvm/java-21-amazon-corretto
          export PATH=$JAVA_HOME/bin:$PATH
          export BENCHMARK_HOME=/opt/benchmark/aurora-dsql-benchbase-benchmarking/target/benchbase-auroradsql
          export AWS_DEFAULT_REGION=us-east-1
          export INSTANCE_ID=3
          export TOTAL_INSTANCES=3
          ENVEOF
          
          echo "export INSTANCE_AZ=us-east-1c" >> /opt/benchmark/benchmark-env.sh
          
          echo "EC2 instance setup completed successfully!"
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-instance-3
        - Key: InstanceIndex
          Value: '3'
        - Key: AvailabilityZone
          Value: us-east-1c

Outputs:
  BenchmarkInstance1Id:
    Description: Instance ID for benchmark instance 1
    Value: !Ref BenchmarkInstance1
    Export:
      Name: !Sub ${EnvironmentName}-BenchmarkInstance1Id

  BenchmarkInstance1PublicIp:
    Description: Public IP for benchmark instance 1
    Value: !GetAtt BenchmarkInstance1.PublicIp
    Export:
      Name: !Sub ${EnvironmentName}-BenchmarkInstance1PublicIp

  BenchmarkInstance1PrivateIp:
    Description: Private IP for benchmark instance 1
    Value: !GetAtt BenchmarkInstance1.PrivateIp
    Export:
      Name: !Sub ${EnvironmentName}-BenchmarkInstance1PrivateIp

  BenchmarkInstance2Id:
    Description: Instance ID for benchmark instance 2
    Value: !Ref BenchmarkInstance2
    Export:
      Name: !Sub ${EnvironmentName}-BenchmarkInstance2Id

  BenchmarkInstance2PublicIp:
    Description: Public IP for benchmark instance 2
    Value: !GetAtt BenchmarkInstance2.PublicIp
    Export:
      Name: !Sub ${EnvironmentName}-BenchmarkInstance2PublicIp

  BenchmarkInstance2PrivateIp:
    Description: Private IP for benchmark instance 2
    Value: !GetAtt BenchmarkInstance2.PrivateIp
    Export:
      Name: !Sub ${EnvironmentName}-BenchmarkInstance2PrivateIp

  BenchmarkInstance3Id:
    Description: Instance ID for benchmark instance 3
    Value: !Ref BenchmarkInstance3
    Export:
      Name: !Sub ${EnvironmentName}-BenchmarkInstance3Id

  BenchmarkInstance3PublicIp:
    Description: Public IP for benchmark instance 3
    Value: !GetAtt BenchmarkInstance3.PublicIp
    Export:
      Name: !Sub ${EnvironmentName}-BenchmarkInstance3PublicIp

  BenchmarkInstance3PrivateIp:
    Description: Private IP for benchmark instance 3
    Value: !GetAtt BenchmarkInstance3.PrivateIp
    Export:
      Name: !Sub ${EnvironmentName}-BenchmarkInstance3PrivateIp

  AllInstanceIds:
    Description: All benchmark instance IDs
    Value: !Join [',', [!Ref BenchmarkInstance1, !Ref BenchmarkInstance2, !Ref BenchmarkInstance3]]

  AllPublicIps:
    Description: All benchmark instance public IPs
    Value: !Join [',', [!GetAtt BenchmarkInstance1.PublicIp, !GetAtt BenchmarkInstance2.PublicIp, !GetAtt BenchmarkInstance3.PublicIp]]
